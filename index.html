<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080D1A">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>GAME BOX | Discover Games</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="top">
    <header class="header">
        <a href="index.html#top" class="logo-link" aria-label="Game Box Home">
            <img class="logo" src="images/Badge.png" alt="Game Box Logo">
        </a>
        <nav class="header-links" aria-label="Main navigation">
            <a href="index.html#top" data-en="Home" data-ar="الرئيسية"></a>
            <a href="all-games.html" data-en="All Games" data-ar="كل الألعاب"></a>
            <a href="categories.html" data-en="Categories" data-ar="التصنيفات"></a>
            <a href="trending.html" data-en="Popular" data-ar="الأكثر شعبية"></a>
            <button id="languageToggle" class="language-toggle" type="button">العربية</button>
        </nav>
    </header>

    <main>
        <section class="home-hero">
            <div class="hero-slideshow" id="heroSlideshow" aria-hidden="true"></div>
            <div class="hero-shade" aria-hidden="true"></div>
            <div class="hero-grid-lines" aria-hidden="true"></div>

            <div class="hero-copy">
                <span class="welcome-text" data-en="YOUR NEXT ADVENTURE STARTS HERE" data-ar="مغامرتك القادمة تبدأ من هنا"></span>
                <h1 class="game-title">GAME <span>BOX</span></h1>
                <p class="hero-description" data-en="Explore 52 games, find a new world, and get every download from its official publisher." data-ar="اكتشف 52 لعبة، وابحث عن عالم جديد، ونزّل الألعاب من صفحات ناشريها الرسمية."></p>
                <form class="landing-page-search" id="homeSearchForm">
                    <input type="search" id="homeSearch" data-en="Search games by name or category..." data-ar="ابحث باسم اللعبة أو التصنيف..." data-placeholder aria-label="Search games">
                    <button class="btn" type="submit" data-en="Explore games" data-ar="تصفح الألعاب"></button>
                </form>
                <div class="hero-facts">
                    <span><b>52</b> <i data-en="games" data-ar="لعبة"></i></span>
                    <span><b>12</b> <i data-en="categories" data-ar="تصنيفات"></i></span>
                    <span data-en="Official download sources" data-ar="مصادر تنزيل رسمية"></span>
                </div>
            </div>
            <button class="hero-next" id="heroNextSlide" type="button" aria-label="Show next featured game">→</button>
        </section>

        <section class="home-section" id="latestGamesSection">
            <div class="section-bar">
                <div>
                    <span class="section-kicker" data-en="JUST ADDED" data-ar="أضيفت حديثًا"></span>
                    <h2 data-en="Latest additions" data-ar="أحدث الإضافات"></h2>
                </div>
                <a class="text-link" href="all-games.html" data-en="View all 52 ↗" data-ar="عرض الـ 52 لعبة ↗"></a>
            </div>
            <div class="home-game-grid" id="latestGames" aria-live="polite"></div>
        </section>

        <section class="home-section categories-section" id="browseCategories">
            <div class="section-bar">
                <div>
                    <span class="section-kicker" data-en="FIND YOUR PLAYSTYLE" data-ar="اختر أسلوب لعبك"></span>
                    <h2 data-en="Browse by category" data-ar="تصفح حسب التصنيف"></h2>
                </div>
                <a class="text-link" href="categories.html" data-en="See all ↗" data-ar="عرض الكل ↗"></a>
            </div>
            <div class="home-category-grid" id="homeCategories"></div>
        </section>

        <section class="home-section weekly-section" id="weekly">
            <div class="section-bar">
                <div>
                    <span class="section-kicker" data-en="WEEKLY EDITOR PICKS" data-ar="اختيارات الأسبوع"></span>
                    <h2 data-en="Most downloaded this week" data-ar="الأكثر تحميلًا هذا الأسبوع"></h2>
                    <p class="section-note" data-en="Curated picks, not live download statistics." data-ar="اختيارات تحريرية وليست إحصاءات تنزيل مباشرة."></p>
                </div>
                <a class="text-link" href="trending.html" data-en="Explore picks ↗" data-ar="اكتشف الاختيارات ↗"></a>
            </div>
            <div class="home-game-grid" id="weeklyGames" aria-live="polite"></div>
        </section>

        <section class="trust-strip">
            <span class="trust-icon" aria-hidden="true">⬡</span>
            <div>
                <strong data-en="Download with confidence" data-ar="نزّل بثقة"></strong>
                <p data-en="Every download button takes you to a publisher's official page or launcher." data-ar="كل زر تنزيل يفتح صفحة الناشر الرسمية أو مشغّله."></p>
            </div>
            <a href="all-games.html" class="btn" data-en="Explore the library" data-ar="تصفح المكتبة"></a>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 GAME BOX · <span data-en="Built for players" data-ar="مصمم للاعبين"></span></p>
        <a href="categories.html" data-en="Browse categories" data-ar="تصفح التصنيفات"></a>
    </footer>

    <script src="supabase-config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
