<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME BOX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body id="top">
    <header class="header">
        <a href="#top" class="logo-link" aria-label="Game Box Home">
            <img
                class="logo"
                src="images/Badge.png"
                alt="Game Box Logo"
            >
        </a>

        <nav class="header-links" aria-label="Main navigation">
            <a href="#top" class="active" aria-current="page">Home</a>
            <a href="all-games.html">All Games</a>
            <a href="categories.html">Categories</a>
            <a href="trending.html">Trending</a>
        </nav>
    </header>

    <main>
        <section class="landing-page">
            <div class="landing-page-left-section">
                <span class="welcome-text">WELCOME TO</span>

                <h1 class="game-title">
                    GAME <span>BOX</span>
                </h1>

                <p class="hero-description">
                    Discover amazing PC games, explore new adventures,
                    and find your next favorite game.
                </p>

                <form class="landing-page-search" id="homeSearchForm">
                    <input
                        type="search"
                        id="homeSearch"
                        placeholder="Search games by name or category..."
                        aria-label="Search for games"
                    >

                    <button class="btn" type="submit">
                        SEARCH
                    </button>
                </form>
            </div>
        </section>

        <section class="trending-container" id="trending">
            <div class="trending-header">
                <div>
                    <span class="section-kicker">
                        DISCOVER YOUR NEXT ADVENTURE
                    </span>

                    <h2>Featured Games</h2>
                </div>

                <a href="all-games.html" class="btn view-all">View All</a>
            </div>

            <div class="trending-cards" id="homeGames" aria-live="polite"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 GAME BOX. All rights reserved.</p>
    </footer>
    <script src="app.js" defer></script>
</body>
</html>
